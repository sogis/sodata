name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'

defaults:
  run:
    shell: bash

jobs:
  verify-native:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps: &native-steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Test and build Native Image
        run: |
          ./mvnw clean test -DexcludedGroups="docker"
          ./mvnw -Penv-prod,native package -DexcludedGroups="docker"

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: reports-jar
          path: sodata-server/target/surefire-reports/

      - name: Test the locally packaged Docker image
        run: |
          docker image inspect sogis/sodata:latest --format '{{.Id}} {{.Os}}/{{.Architecture}}'
          test "$(docker image inspect sogis/sodata:latest --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          ./mvnw test -Dgroups="docker" -Dapi.version="$(docker version --format '{{.Server.APIVersion}}')"

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: reports-docker
          path: sodata-server/target/surefire-reports/

      - name: Smoke-test Native Image on x86-64-v2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          readelf -n sodata-server/target/sodata-server
          id=$(docker run -d --network none --user 1000830000:0 --read-only --tmpfs /tmp:rw,exec \
            -v "$PWD/sodata-server/src/test/resources/datasearch.xml:/config/datasearch.xml:ro" \
            -v /usr/bin/qemu-x86_64-static:/qemu-x86_64-static:ro --entrypoint /qemu-x86_64-static \
            sogis/sodata:latest -cpu Nehalem ./application)
          trap 'docker logs "$id"; docker rm -f "$id"' EXIT
          pid=$(docker inspect --format '{{.State.Pid}}' "$id")
          curl_app() { sudo nsenter --target "$pid" --net curl -fsS --max-time 3 "http://127.0.0.1:8080$1"; }
          for _ in {1..30}; do
            if curl_app /actuator/health/readiness | jq -e '.status == "UP"'; then
              curl_app /actuator/health/liveness | jq -e '.status == "UP"'
              curl_app '/themepublications?query=afu' | grep -F 'fliess' >/dev/null
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && !env.ACT
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && !env.ACT
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested AMD64 image
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && !env.ACT
        run: |
          for repo in sogis/sodata ghcr.io/sogis/sodata; do
            for tag in latest "0.0.${GITHUB_RUN_NUMBER}" 0.0 0; do
              docker tag sogis/sodata:latest "$repo:$tag"
              docker push "$repo:$tag"
            done
          done

  build-native:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps: *native-steps
